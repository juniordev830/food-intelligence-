[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "food-intelligence"
version = "0.1.0"
description = "Plataforma de Machine Learning para churn, recomendação e elasticidade-preço em alimentos B2B"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
